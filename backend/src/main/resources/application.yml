spring:
  application:
    name: dvd-rental
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dvd_rental?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:dvd}
    password: ${DB_PASSWORD:dvd}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  session:
    timeout: 8h

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: DVDSESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui.html

app:
  seed:
    enabled: ${APP_SEED_ENABLED:true}
  pricing:
    overdue-multiplier: ${OVERDUE_MULTIPLIER:1.0}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    org.springframework.security: INFO
---
spring:
  config:
    activate:
      on-profile: prod
app:
  seed:
    enabled: false
server:
  servlet:
    session:
      cookie:
        secure: true
management:
  endpoints:
    web:
      exposure:
        include: health
